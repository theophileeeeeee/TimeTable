<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="manifest/site.webmanifest">
    <meta name="theme-color" content="#6c47ff">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <title>Timetable</title>
    <style>
        :root {
            --bg:        #f7f7fb;
            --surface:   #ffffff;
            --surface2:  #f0f0f8;
            --border:    #e4e4f0;
            --text:      #1a1a2e;
            --text2:     #6b6b8a;
            --text3:     #a0a0bc;
            --accent:    #6c47ff;
            --accent-lo: #ede9ff;
            --accent-hi: #8b6aff;
            --mint:      #00c896;
            --mint-lo:   #e0faf4;
            --amber:     #f59e0b;
            --amber-lo:  #fff8e6;
            --red:       #f43f5e;
            --red-lo:    #fff0f3;
            --radius:    10px;
            --shadow:    0 2px 12px rgba(108,71,255,0.07);
        }
        body.dark {
            --bg:        #0e0e18;
            --surface:   #17172a;
            --surface2:  #1e1e34;
            --border:    #2a2a44;
            --text:      #eeeeff;
            --text2:     #9898bb;
            --text3:     #55556a;
            --accent:    #7c5cff;
            --accent-lo: #1e1a3a;
            --accent-hi: #9d82ff;
            --mint:      #00d4a1;
            --mint-lo:   #0a2a22;
            --amber:     #fbbf24;
            --amber-lo:  #2a1e06;
            --red:       #fb4570;
            --red-lo:    #2a0a14;
            --shadow:    0 2px 16px rgba(0,0,0,0.35);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background .3s, color .3s;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            height: 56px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .topbar-time {
            font-family: 'Inter', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: -.5px;
            min-width: 48px;
        }

        .topbar-title {
            flex: 1;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-actions { display: flex; gap: 6px; align-items: center; }

        .icon-btn {
            width: 34px; height: 34px;
            border-radius: 8px;
            border: none;
            background: var(--surface2);
            color: var(--text2);
            cursor: pointer;
            font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            transition: background .15s, transform .15s, color .15s;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: var(--accent-lo); color: var(--accent); transform: scale(1.05); }
        .icon-btn.active { background: var(--accent); color: #fff; }
        .icon-btn.hidden { display: none; }

        .progress-wrap {
            height: 3px;
            background: var(--border);
            position: relative;
            overflow: visible;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--mint));
            transition: width .5s ease;
            border-radius: 0 2px 2px 0;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -4px; top: -3px;
            width: 9px; height: 9px;
            border-radius: 50%;
            background: var(--mint);
            box-shadow: 0 0 6px var(--mint);
        }

        .slot-progress-wrap {
            height: 2px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .slot-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--mint));
            border-radius: 2px;
            transition: width .5s ease;
        }

        .time-remaining {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 99px;
            background: var(--accent);
            color: #fff;
            margin-left: 6px;
            letter-spacing: .02em;
            vertical-align: middle;
        }

        .page { padding: 16px; max-width: 1320px; margin: 0 auto; transition: all 0.3s ease; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 16px;
            align-items: start;
            transition: grid-template-columns 0.3s ease;
        }

        body.focus-mode .sidebar { display: none !important; }
        body.focus-mode .grid { grid-template-columns: 1fr !important; }
        body.focus-mode .day-nav { display: none !important; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 14px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .card-title {
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: .04em;
        }

        .sched-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 99px;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        .badge-school { background: var(--accent-lo); color: var(--accent); }
        .badge-summer { background: var(--amber-lo); color: var(--amber); }
        .badge-mint { background: var(--mint-lo); color: var(--mint); }

        .day-label { font-size: 12px; color: var(--text2); font-weight: 500; }

        .day-nav { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

        .nav-btn {
            width: 28px; height: 28px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: all .15s;
        }
        .nav-btn:hover { background: var(--accent-lo); color: var(--accent); border-color: var(--accent); }

        .nav-today {
            height: 28px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            transition: all .15s;
        }
        .nav-today:hover { background: var(--accent-lo); color: var(--accent); border-color: var(--accent); }

        .table-container { width: 100%; overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        col.col-time { width: 35%; }
        col.col-act  { width: 65%; }

        thead th {
            background: var(--surface2);
            color: var(--text2);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        tbody td {
            padding: 11px 16px;
            font-size: 13px;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            word-break: break-word;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: var(--surface2); }

        tbody tr.active-row td { background: var(--accent-lo) !important; }
        tbody tr.active-row td:first-child { border-left: 3px solid var(--accent); padding-left: 13px; }
        tbody tr.active-row .time-cell { color: var(--accent) !important; font-weight: 600; }
        tbody tr.active-row .act-cell { color: var(--accent) !important; font-weight: 600; }

        td.time-cell { font-variant-numeric: tabular-nums; color: var(--text2); font-size: 12px; }

        .sidebar { display: flex; flex-direction: column; gap: 14px; }

        .greeting-card {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hi) 100%);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: opacity .2s;
            margin-bottom: 4px;
        }
        .greeting-card:hover { opacity: .9; }
        .greeting-emoji { font-size: 22px; }
        .greeting-text { font-size: 14px; font-weight: 600; color: #fff; }
        .greeting-sub { font-size: 11px; color: rgba(255,255,255,.7); margin-top: 1px; }

        .name-input-wrap { display: flex; gap: 8px; margin-bottom: 4px; }
        .name-input-wrap input {
            flex: 1;
            padding: 9px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color .15s;
        }
        .name-input-wrap input:focus { border-color: var(--accent); }
        .name-input-wrap input::placeholder { color: var(--text3); }
        .name-input-wrap button {
            padding: 0 14px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--text3);
            padding: 10px 16px 6px;
        }

        .todo-list { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 4px; }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 8px;
            transition: background .15s;
            cursor: pointer;
        }
        .todo-item:hover { background: var(--surface2); }
        .todo-item.done { opacity: .55; }
        .todo-item.done .todo-label { text-decoration: line-through; }

        .todo-check {
            width: 18px; height: 18px;
            border-radius: 5px;
            border: 2px solid var(--border);
            background: transparent;
            cursor: pointer;
            accent-color: var(--accent);
            flex-shrink: 0;
        }
        .todo-label { flex: 1; font-size: 13px; color: var(--text); cursor: pointer; }
        .todo-tag {
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            background: var(--surface2);
            color: var(--text3);
            flex-shrink: 0;
        }

        .routine-pct-wrap { display: flex; align-items: center; gap: 10px; padding: 4px 16px 2px; }
        .routine-ring-mini { flex-shrink: 0; }
        .routine-pct-text { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent); }
        .routine-pct-sub { font-size: 11px; color: var(--text2); }

        .chart-toolbar { display: flex; gap: 6px; padding: 0 16px 10px; }
        .range-btn {
            padding: 5px 11px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text2);
            font-family: 'Inter', sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
        }
        .range-btn:hover { border-color: var(--accent); color: var(--accent); }
        .range-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .chart-canvas-wrap { padding: 6px 14px 16px; }

        .goal-tabs { display: flex; gap: 4px; padding: 4px; margin: 10px 12px 0; background: var(--surface2); border-radius: 10px; }
        .goal-tab-btn {
            flex: 1;
            padding: 7px 0;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--text2);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
        }
        .goal-tab-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .goal-tab-panel { display: none; }
        .goal-tab-panel.active { display: block; }

        .pomo-card { display: flex; flex-direction: column; align-items: center; padding: 18px 12px; gap: 10px; }
        .pomo-ring-wrap { position: relative; width: 168px; height: 168px; }
        .pomo-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .pomo-ring-bg { fill: none; stroke: var(--surface2); stroke-width: 10; }
        .pomo-ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .3s; }
        .pomo-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pomo-time { font-family: 'Inter', monospace; font-size: 28px; font-weight: 700; color: var(--text); }
        .pomo-mode { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
        .pomo-controls { display: flex; gap: 8px; }
        .pomo-btn { padding: 8px 16px; border-radius: 8px; border: none; background: var(--accent); color: white; font-size: 12.5px; font-weight: 600; cursor: pointer; }
        .pomo-btn:hover { background: var(--accent-hi); }
        .pomo-btn.running { background: var(--red); }
        .pomo-btn.ghost { background: var(--surface2); color: var(--text2); }
        .pomo-btn.ghost:hover { background: var(--border); }
        .pomo-cycles { font-size: 11px; color: var(--text3); }

        .pomo-fullscreen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 400;
            background: var(--bg);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
        }
        .pomo-fullscreen.show { display: flex; }
        .pomo-fullscreen .pomo-ring-wrap { width: min(70vw, 380px); height: min(70vw, 380px); }
        .pomo-fullscreen .pomo-time { font-size: 54px; }
        .pomo-fullscreen .pomo-mode { font-size: 13px; }
        .pomo-fs-close {
            position: absolute; top: 18px; right: 18px;
            width: 38px; height: 38px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text2); font-size: 16px; cursor: pointer;
        }
        .pomo-fs-close:hover { color: var(--accent); border-color: var(--accent); }

        .brain-textarea { width: calc(100% - 20px); margin: 0 10px 10px; height: 90px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); border-radius: 6px; padding: 8px; font-family: inherit; font-size: 12px; resize: none; outline: none; }
        .brain-textarea:focus { border-color: var(--accent); background: var(--surface); }

        .admin-panel { display: none; }
        .admin-panel.show { display: flex; flex-direction: column; gap: 14px; }
        .admin-only-card { display: none; }
        .admin-only-card.show { display: block; }

        .atodo-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            border-radius: 8px;
            transition: background .15s;
        }
        .atodo-item:hover { background: var(--surface2); }
        .atodo-item.done { opacity: .5; }
        .atodo-item.done .atodo-label { text-decoration: line-through; }

        .atodo-check {
            width: 17px; height: 17px;
            border-radius: 5px;
            border: 2px solid var(--border);
            cursor: pointer;
            accent-color: var(--mint);
            flex-shrink: 0;
        }
        .atodo-label { flex: 1; font-size: 13px; color: var(--text); min-width: 0; }

        .prio-tag { font-size: 9px; font-weight: bold; padding: 1px 5px; border-radius: 4px; text-transform: uppercase; margin-right: 4px; display: inline-block; vertical-align: middle;}
        .prio-high { background: var(--red-lo); color: var(--red); }
        .prio-med { background: var(--amber-lo); color: var(--amber); }
        .prio-low { background: var(--accent-lo); color: var(--accent); }

        .atodo-del {
            width: 22px; height: 22px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text3);
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            transition: all .15s;
            flex-shrink: 0;
        }
        .atodo-item:hover .atodo-del { opacity: 1; }
        .atodo-del:hover { background: var(--red-lo); color: var(--red); }

        .add-row { padding: 10px; border-top: 1px solid var(--border); }
        .add-row-inputs { display: flex; gap: 6px; width: 100%; align-items: center; }
        .add-input {
            flex: 1;
            padding: 8px 10px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: var(--surface2);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color .15s;
            min-width: 0;
        }
        .add-input:focus { border-color: var(--accent); background: var(--surface); }
        .add-input::placeholder { color: var(--text3); }

        .prio-select, .cat-select {
            padding: 0 4px;
            height: 34px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: var(--surface2);
            color: var(--text);
            font-size: 12px;
            outline: none;
            flex-shrink: 0;
        }

        .add-btn {
            width: 34px; height: 34px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform .15s, background .15s;
            flex-shrink: 0;
        }
        .add-btn:hover { transform: scale(1.05); background: var(--accent-hi); }

        .empty-state { text-align: center; padding: 20px 16px; color: var(--text3); font-size: 12px; }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            backdrop-filter: blur(4px);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        .overlay.show { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: min(360px, 92vw);
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-title { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); }
        .modal-sub { font-size: 13px; color: var(--text2); margin-top: -8px; }
        .modal-input {
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: var(--surface2);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color .15s;
        }
        .modal-input:focus { border-color: var(--accent); }
        .modal-error { font-size: 12px; color: var(--red); display: none; }
        .modal-error.show { display: block; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-ghost {
            padding: 9px 14px; border-radius: 9px; border: 1px solid var(--border);
            background: transparent; color: var(--text2); font-family: 'Inter', sans-serif;
            font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .btn-primary {
            padding: 9px 16px; border-radius: 9px; border: none;
            background: var(--accent); color: #fff; font-family: 'Inter', sans-serif;
            font-size: 13px; font-weight: 600; cursor: pointer;
        }

        @media (max-width: 900px) { .grid { grid-template-columns: 1fr 260px; gap: 14px; } }
        @media (max-width: 680px) {
            .page { padding: 12px; }
            .grid { grid-template-columns: 1fr; gap: 14px; }
            .sidebar { order: 2; }
            body.focus-mode .sidebar { display: none !important; }
            .card-header { padding: 10px 12px; }
            thead th, tbody td { padding: 10px 12px; font-size: 12px; }
            col.col-time { width: 40%; }
            col.col-act  { width: 60%; }
        }
    </style>
</head>
<body>

<div class="overlay" id="loginOverlay">
    <div class="modal">
        <div>
            <div class="modal-title">🔒 Mode admin</div>
            <div class="modal-sub">Planning complet + gestion des objectifs</div>
        </div>
        <input type="password" class="modal-input" id="pwdInput" placeholder="Mot de passe…" autocomplete="off">
        <div class="modal-error" id="loginError">Mot de passe incorrect.</div>
        <div class="modal-actions">
            <button class="btn-ghost" id="btnCancel">Annuler</button>
            <button class="btn-primary" id="btnConfirm">Entrer</button>
        </div>
    </div>
</div>

<div class="pomo-fullscreen" id="pomoFullscreen">
    <button class="pomo-fs-close" id="pomoFsClose">✕</button>
    <div class="pomo-ring-wrap">
        <svg viewBox="0 0 200 200">
            <circle class="pomo-ring-bg" cx="100" cy="100" r="88"></circle>
            <circle class="pomo-ring-fg" id="pomoRingFsFg" cx="100" cy="100" r="88"></circle>
        </svg>
        <div class="pomo-ring-center">

function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
}

function dateKeyOffset(daysAgo) {
    const d = new Date();
    d.setDate(d.getDate() - daysAgo);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
}

function parse(s) {
    if (!s) return 0;
    s = String(s).trim();
    if (!s) return 0;
    const [h, m] = s.split(':').map(Number);
    return (isNaN(h) ? 0 : h) + (isNaN(m) ? 0 : m) / 60;
}

function parseSlot(txt) {
    const parts = txt.trim().split(/\s*[-–—]\s*/);
    if (parts.length < 2) return null;
    const start = parse(parts[0]);
    let end = parse(parts[1]);
    if (end === 0 && parts[1].trim().startsWith('00')) end = 24;
    if (end <= start) end += 24;
    return { start, end };
}

function formatRemaining(hours) {
    const totalMin = Math.round(hours * 60);
    if (totalMin <= 0) return null;
    if (totalMin < 60) return `${totalMin} min`;
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return m > 0 ? `${h}h${String(m).padStart(2,'0')}` : `${h}h`;
}

function getViewedDow() {
    const d = new Date(); d.setDate(d.getDate() + viewOffset); return d.getDay();
}

function getSchedule() {
    if (!isAdmin) return SCOLAIRE;
    const dow = getViewedDow();
    if (dow === 6) return ETE_SAMEDI;
    if (dow === 0) return ETE_DIMANCHE;
    return ETE_SEMAINE;
}

function renderSchedule() {
    const data = getSchedule();
    document.getElementById('scheduleBody').innerHTML = data.map(([h, a]) =>
        `<tr><td class="time-cell">${h}</td><td class="act-cell">${a}</td></tr>`
    ).join('');

    const dow = getViewedDow();
    const badge = document.getElementById('modeBadge');
    if (isAdmin) {
        const t = dow===0?"Dimanche":dow===6?"Samedi":"Lun–Ven";
        badge.textContent = `Été · ${t}`;
        badge.className = 'badge badge-summer';
        document.getElementById('adminBtn').classList.add('active');
    } else {
        badge.textContent = 'Scolaire';
        badge.className = 'badge badge-school';
        document.getElementById('adminBtn').classList.remove('active');
    }

    const lbl = document.getElementById('dayLabel');
    lbl.textContent = viewOffset===0 ? `${JOURS[dow]} · Aujourd'hui`
                    : viewOffset===1 ? `${JOURS[dow]} · Demain`
                    : viewOffset===-1? `${JOURS[dow]} · Hier`
                    : JOURS[dow];

    document.getElementById('adminPanel').classList.toggle('show', isAdmin);
    document.querySelectorAll('.admin-only-card').forEach(el => el.classList.toggle('show', isAdmin));
    updateActiveRow();
}

function updateActiveRow() {
    const rows = document.querySelectorAll('#scheduleBody tr');
    rows.forEach(r => r.classList.remove('active-row'));

    const fill = document.getElementById('progressFill');
    if (viewOffset !== 0) { fill.style.width = '0%'; return; }

    const now = new Date();
    const cur = now.getHours() + now.getMinutes() / 60;

    const dayStart = 6, dayEnd = 23.99;
    const pct = Math.max(0, Math.min(100, (cur - dayStart) / (dayEnd - dayStart) * 100));
    fill.style.width = pct + '%';

    rows.forEach(row => {
        const timeCell = row.querySelector('.time-cell');
        const actCell = row.querySelector('.act-cell');
        if (!timeCell || !actCell) return;

        const slot = parseSlot(timeCell.textContent);
        if (!slot) return;

        if (cur >= slot.start && cur < slot.end) {
            row.classList.add('active-row');

            const remaining = slot.end - cur;
            const remStr = formatRemaining(remaining);
            const slotDuration = slot.end - slot.start;
            const elapsed = cur - slot.start;
            const slotPct = Math.max(0, Math.min(100, (elapsed / slotDuration) * 100));

            const existingBadge = actCell.querySelector('.time-remaining');
            const existingBar = actCell.querySelector('.slot-progress-wrap');
            if (existingBadge) existingBadge.remove();
            if (existingBar) existingBar.remove();

            if (remStr) {
                const badgeEl = document.createElement('span');
                badgeEl.className = 'time-remaining';
                badgeEl.textContent = `−${remStr}`;
                actCell.appendChild(badgeEl);
            }

            const barWrap = document.createElement('div');
            barWrap.className = 'slot-progress-wrap';
            barWrap.innerHTML = `<div class="slot-progress-fill" style="width:${slotPct.toFixed(1)}%"></div>`;
            actCell.appendChild(barWrap);
        } else {
            const existingBadge = actCell.querySelector('.time-remaining');
            const existingBar = actCell.querySelector('.slot-progress-wrap');
            if (existingBadge) existingBadge.remove();
            if (existingBar) existingBar.remove();
        }
    });
}

const POMO_FOCUS = 25 * 60;
const POMO_SHORT = 5 * 60;
const POMO_LONG = 15 * 60;
const POMO_LONG_EVERY = 4;
const POMO_CIRC = 2 * Math.PI * 88;

let pomoInterval = null;
let pomoTotal = POMO_FOCUS;
let pomoTimeLeft = POMO_FOCUS;
let pomoIsBreak = false;
let pomoFocusCount = 0;

const pomoRingFg = document.getElementById('pomoRingFg');
const pomoRingFsFg = document.getElementById('pomoRingFsFg');
[pomoRingFg, pomoRingFsFg].forEach(el => {
    el.style.strokeDasharray = `${POMO_CIRC}`;
    el.style.strokeDashoffset = `0`;
});

function playBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [880, 1100].forEach((freq, i) => {
            setTimeout(() => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.8);
            }, i * 400);
        });
    } catch(e) {}
}

function updatePomoDisplay() {
    const min = String(Math.floor(pomoTimeLeft / 60)).padStart(2, '0');
    const sec = String(pomoTimeLeft % 60).padStart(2, '0');
    const txt = `${min}:${sec}`;
    document.getElementById('pomoTime').textContent = txt;
    document.getElementById('pomoTimeFs').textContent = txt;

    const modeTxt = pomoIsBreak ? (pomoTotal === POMO_LONG ? "Pause longue ☕" : "Pause ☕") : "Focus 🎯";
    document.getElementById('pomoMode').textContent = modeTxt;
    document.getElementById('pomoModeFs').textContent = modeTxt;

    const offset = POMO_CIRC * (1 - pomoTimeLeft / pomoTotal);
    const color = pomoIsBreak ? 'var(--mint)' : 'var(--accent)';
    [pomoRingFg, pomoRingFsFg].forEach(el => {
        el.style.strokeDashoffset = `${offset}`;
        el.style.stroke = color;
    });

    const cyclesTxt = `Cycle ${pomoFocusCount % POMO_LONG_EVERY + (pomoIsBreak?0:1)} / ${POMO_LONG_EVERY}`;
    document.getElementById('pomoCycles').textContent = cyclesTxt;
    document.getElementById('pomoCyclesFs').textContent = cyclesTxt;
}

function togglePomo() {
    const btns = [document.getElementById('pomoBtn'), document.getElementById('pomoBtnFs')];
    if (pomoInterval) {
        clearInterval(pomoInterval);
        pomoInterval = null;
        btns.forEach(b => { b.textContent = "Lancer"; b.classList.remove('running'); });
    } else {
        btns.forEach(b => { b.textContent = "Pause"; b.classList.add('running'); });
        pomoInterval = setInterval(() => {
            if (pomoTimeLeft > 0) {
                pomoTimeLeft--;
                updatePomoDisplay();
            } else {
                clearInterval(pomoInterval);
                pomoInterval = null;
                playBeep();
                if (!pomoIsBreak) {
                    pomoFocusCount++;
                    pomoIsBreak = true;
                    pomoTotal = (pomoFocusCount % POMO_LONG_EVERY === 0) ? POMO_LONG : POMO_SHORT;
                } else {
                    pomoIsBreak = false;
                    pomoTotal = POMO_FOCUS;
                }
                pomoTimeLeft = pomoTotal;
                btns.forEach(b => { b.textContent = "Lancer"; b.classList.remove('running'); });
                updatePomoDisplay();
            }
        }, 1000);
    }
}

function resetPomo() {
    clearInterval(pomoInterval);
    pomoInterval = null;
    pomoIsBreak = false;
    pomoTotal = POMO_FOCUS;
    pomoTimeLeft = POMO_FOCUS;
    [document.getElementById('pomoBtn'), document.getElementById('pomoBtnFs')].forEach(b => {
        b.textContent = "Lancer"; b.classList.remove('running');
    });
    updatePomoDisplay();
}

document.getElementById('pomoBtn').addEventListener('click', togglePomo);

document.getElementById('pomoReset').addEventListener('click', resetPomo);

    if (pwdInput.value === ADMIN_PASSWORD) {
        isAdmin = true;
        sessionStorage.setItem('adminMode', '1');
        overlay.classList.remove('show');
        renderSchedule();
        setupFirebaseListeners();
    } else {
        loginError.classList.add('show');
        pwdInput.value = ''; pwdInput.focus();
    }
}

let routineTemplate = [];
let routineUnsub = null;
let routineLogUnsub = null;
let todayRoutineLog = {};

function currentDayCategory() {
    const dow = new Date().getDay();
    return (dow === 0 || dow === 6) ? 'weekend' : 'weekday';
}

function applicableRoutineItems() {
    const cat = currentDayCategory();
    return routineTemplate.filter(it => it.category === 'fixed' || it.category === cat);
}

function renderRoutine() {
    const items = applicableRoutineItems();
    const list = document.getElementById('routineList');
    document.getElementById('routineDayTypeBadge').textContent = currentDayCategory() === 'weekend' ? 'Week-end' : 'Semaine';

    if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">Aucun item de routine configuré.</div>';
    } else {
        list.innerHTML = items.map(it => {
            const done = !!(todayRoutineLog[it.id]);
            return `
            <div class="todo-item ${done ? 'done' : ''}" data-id="${it.id}">
                <input type="checkbox" class="todo-check" ${done ? 'checked' : ''}>
                <span class="todo-label">${it.text}</span>
                <span class="todo-tag">${it.category === 'fixed' ? 'fixe' : it.category === 'weekday' ? 'sem.' : 'w-e'}</span>
            </div>`;
        }).join('');

        list.querySelectorAll('.todo-item').forEach(el => {
            const id = el.getAttribute('data-id');
            const cb = el.querySelector('.todo-check');
            el.addEventListener('click', (e) => {
                if (e.target === cb) return;
                cb.checked = !cb.checked;
                cb.dispatchEvent(new Event('change'));
            });
            cb.addEventListener('change', () => toggleRoutineItem(id, cb.checked));
        });
    }

    const done = items.filter(it => todayRoutineLog[it.id]).length;
    const total = items.length;
    const pct = total ? Math.round((done/total)*100) : 0;
    document.getElementById('routinePctText').textContent = `${pct}%`;
    document.getElementById('routinePctSub').textContent = `${done} / ${total} tenus aujourd'hui`;
    const ringCirc = 2 * Math.PI * 16;
    const ring = document.getElementById('routineRingFg');
    ring.style.strokeDasharray = `${ringCirc}`;
    ring.style.strokeDashoffset = `${ringCirc * (1 - pct/100)}`;
}

function toggleRoutineItem(id, val) {
    todayRoutineLog[id] = val;
    const items = applicableRoutineItems();
    const done = items.filter(it => todayRoutineLog[it.id]).length;
    const total = items.length;
    const pct = total ? Math.round((done/total)*100) : 0;
    db.collection('routineLog').doc(todayKey()).set({
        date: todayKey(),
        completed: todayRoutineLog,
        pct: pct,
        updatedAt: Date.now()
    }, { merge: true });
    renderRoutine();
}

function loadRoutineTemplate() {
    routineUnsub = db.collection('routineTemplate').onSnapshot(async snapshot => {
        if (snapshot.empty && !snapshot.metadata.fromCache) {
            for (const item of DEFAULT_ROUTINE) {
                await db.collection('routineTemplate').add({ ...item, createdAt: Date.now() });
            }
            return;
        }
        routineTemplate = [];
        snapshot.forEach(doc => routineTemplate.push({ id: doc.id, ...doc.data() }));
        renderRoutine();
        renderRoutineAdmin();
    });

    routineLogUnsub = db.collection('routineLog').doc(todayKey()).onSnapshot(doc => {
        todayRoutineLog = (doc.exists && doc.data().completed) ? doc.data().completed : {};
        renderRoutine();
    });
}

function renderRoutineAdmin() {
    const wrap = document.getElementById('routineAddRow');
    if (!wrap) return;
}

document.getElementById('addRoutineBtn').addEventListener('click', () => {

});
document.getElementById('addRoutineInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('addRoutineBtn').click(); });

let routineChart = null;
let currentRange = 60;

function chartColors() {
    const dark = document.body.classList.contains('dark');
    return {
        line: dark ? '#7c5cff' : '#6c47ff',
        fillTop: dark ? 'rgba(124,92,255,0.25)' : 'rgba(108,71,255,0.18)',
        fillBottom: dark ? 'rgba(124,92,255,0)' : 'rgba(108,71,255,0)',
        grid: dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)',
        text: dark ? '#9898bb' : '#6b6b8a'
    };
}

async function loadChartData(rangeDays) {
    const startKey = dateKeyOffset(rangeDays - 1);
    const snapshot = await db.collection('routineLog')
        .where('date', '>=', startKey)
        .orderBy('date', 'asc')
        .get();

    const map = {};
    snapshot.forEach(doc => { const d = doc.data(); map[d.date] = d.pct; });

    const labels = [];
    const values = [];
    for (let i = rangeDays - 1; i >= 0; i--) {
        const key = dateKeyOffset(i);
        labels.push(key.slice(5));
        values.push(key in map ? map[key] : null);
    }
    return { labels, values };
}

async function renderChart(rangeDays) {
    const { labels, values } = await loadChartData(rangeDays);
    const colors = chartColors();
    const ctx = document.getElementById('routineChart').getContext('2d');

    const gradient = ctx.createLinearGradient(0, 0, 0, 160);
    gradient.addColorStop(0, colors.fillTop);
    gradient.addColorStop(1, colors.fillBottom);

    if (routineChart) routineChart.destroy();
    routineChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [{
                data: values,
                borderColor: colors.line,
                backgroundColor: gradient,
                fill: true,
                tension: 0.4,
                spanGaps: true,
                pointRadius: 0,
                pointHoverRadius: 4,
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: {
                    ticks: { color: colors.text, maxTicksLimit: 8, font: { size: 10 } },
                    grid: { display: false }
                },
                y: {
                    min: 0, max: 100,
                    ticks: { color: colors.text, callback: v => v + '%', font: { size: 10 } },
                    grid: { color: colors.grid }
                }
            }
        }
    });
}

document.getElementById('rangeToolbar').addEventListener('click', (e) => {
    const btn = e.target.closest('.range-btn');
    if (!btn) return;
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRange = parseInt(btn.getAttribute('data-range'), 10);
    renderChart(currentRange);
});

let unsubscribeTodos = null;
let unsubGoalsWeek = null, unsubGoalsMonth = null, unsubGoalsYear = null;

function clearAdminInterface() {
    if (unsubscribeTodos) unsubscribeTodos();
    if (unsubGoalsWeek) unsubGoalsWeek();
    if (unsubGoalsMonth) unsubGoalsMonth();
    if (unsubGoalsYear) unsubGoalsYear();
    document.getElementById('todayList').innerHTML = '<div class="empty-state">Mode Admin déconnecté.</div>';
    ['goalsWeekList','goalsMonthList','goalsYearList'].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="empty-state">Mode Admin déconnecté.</div>';
    });
}

function setupFirebaseListeners() {
    if (!isAdmin) return;

    unsubscribeTodos = db.collection('todos').onSnapshot(snapshot => {
        let localTodos = [];
        snapshot.forEach(doc => localTodos.push({ id: doc.id, ...doc.data() }));
        localTodos.sort((a,b) => (a.priority || 'B').localeCompare(b.priority || 'B'));
        renderCloudTodos(localTodos, 'todayList', 'todos');
    });

    unsubGoalsWeek = db.collection('goalsWeek').onSnapshot(snapshot => {
        let items = [];
        snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
        items.sort((a,b) => (a.priority || 'B').localeCompare(b.priority || 'B'));
        renderCloudTodos(items, 'goalsWeekList', 'goalsWeek');
    });

    unsubGoalsMonth = db.collection('goalsMonth').onSnapshot(snapshot => {
        let items = [];
        snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
        items.sort((a,b) => (a.priority || 'B').localeCompare(b.priority || 'B'));
        renderCloudTodos(items, 'goalsMonthList', 'goalsMonth');
    });

    unsubGoalsYear = db.collection('goalsYear').onSnapshot(snapshot => {
        let items = [];
        snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
        items.sort((a,b) => (a.priority || 'B').localeCompare(b.priority || 'B'));
        renderCloudTodos(items, 'goalsYearList', 'goalsYear');
    });
}

function renderCloudTodos(itemsList, containerId, collectionName) {
    const container = document.getElementById(containerId);
    if (itemsList.length === 0) {
        container.innerHTML = '<div class="empty-state">Rien pour le moment.</div>';
        return;
    }
    container.innerHTML = itemsList.map(t => {
        const lblPrio = t.priority === 'A' ? 'Urgent' : t.priority === 'C' ? 'Bas' : 'Moyen';
        const clsPrio = t.priority === 'A' ? 'prio-high' : t.priority === 'C' ? 'prio-low' : 'prio-med';
        return `
        <div class="atodo-item ${t.done ? 'done' : ''}" data-id="${t.id}">
            <input type="checkbox" class="atodo-check" ${t.done ? 'checked' : ''}>
            <span class="atodo-label"><span class="prio-tag ${clsPrio}">${lblPrio}</span>${t.text}</span>
            <button class="atodo-del">🗑️</button>
        </div>`;
    }).join('');

    container.querySelectorAll('.atodo-item').forEach(item => {
        const id = item.getAttribute('data-id');
        const cb = item.querySelector('.atodo-check');
        cb.addEventListener('change', () => db.collection(collectionName).doc(id).update({ done: cb.checked }));
        item.querySelector('.atodo-del').addEventListener('click', () => db.collection(collectionName).doc(id).delete());
    });
}
